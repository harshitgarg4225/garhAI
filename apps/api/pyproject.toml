[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garh-api"
version = "0.1.0"
description = "Garh AI API — FastAPI + SQLAlchemy 2 + Alembic, multi-tenant house-design platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [{ name = "Garh AI" }]

# Runtime deps. Versions are PINNED exactly — the workspace must stay self-consistent.
# License gate (see references/market-research-and-oss-licenses.md): Apache/MIT/BSD/MPL only.
dependencies = [
  "fastapi==0.115.0",              # MIT
  "uvicorn[standard]==0.31.0",     # BSD-3
  "sqlalchemy[asyncio]==2.0.35",   # MIT
  "alembic==1.13.3",               # MIT
  "pydantic==2.9.2",               # MIT
  "pydantic-settings==2.5.2",      # MIT
  "psycopg[binary]==3.2.3",        # LGPL-3.0 (driver, dynamically linked; not app code)
  "redis==5.1.1",                  # MIT
  "pyjwt[crypto]==2.9.0",          # MIT (RS256 needs the crypto extra)
  "sse-starlette==2.1.3",          # BSD-3
  "structlog==24.4.0",             # Apache-2.0 / MIT dual
  "httpx==0.27.2",                 # BSD-3
  "python-ulid==2.7.0",            # MIT
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",                 # MIT
  "pytest-asyncio==0.24.0",        # Apache-2.0
  "hypothesis==6.112.2",           # MPL-2.0
  "ruff==0.6.9",                   # MIT
  "mypy==1.11.2",                  # MIT
]

[tool.hatch.build.targets.wheel]
# garh_model/ is owned by the model-core agent but ships inside this distribution.
packages = ["garh_api", "garh_model"]

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle / pyflakes
  "I",                # isort
  "UP",               # pyupgrade
  "B",                # bugbear
  "C4",               # comprehensions
  "SIM",              # simplify
  "ASYNC",            # async correctness
  "RUF",
]
ignore = [
  "B008",  # FastAPI Depends() in defaults is idiomatic
  "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"garh_api/repositories/__init__.py" = ["F401"]  # re-export surface
"garh_api/models.py" = ["RUF012"]               # ClassVar-ish declarative attrs

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Types — playbook §1: mypy strict on garh_model and services/*
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
plugins = []
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
exclude = "migrations/versions/"

[[tool.mypy.overrides]]
module = "garh_model.*"
strict = true

[[tool.mypy.overrides]]
module = ["sse_starlette.*", "sentry_sdk.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
# Every Python test tree under apps/api. `["tests"]` alone silently collected
# none of the model-core or rules-engine suites (~300 + 8 files of assertions),
# which made `make test-py` and the CI unit job look green while running a
# fraction of the suite. If you add a package with tests, add it here.
testpaths = ["tests", "garh_model/tests", "garh_rules/tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs a live Postgres/Redis",
  "golden: golden-file comparison",
]
