# Alembic configuration for the Garh AI API.
#
# Run from apps/api:
#   alembic upgrade head            # apply
#   alembic downgrade -1            # roll back one revision
#   alembic revision --autogenerate -m "..."   # after editing garh_api/models.py
#
# There is no sqlalchemy.url here on purpose: migrations/env.py reads DATABASE_URL
# through garh_api.config, so there is exactly one source of connection truth and no
# risk of a checked-in URL pointing at the wrong database.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# Left empty — env.py supplies the URL from settings.
sqlalchemy.url =

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
