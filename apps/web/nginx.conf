# Garh AI — web `prod` stage server config (playbook §13 "Web" row).
#
# WHY THIS FILE EXISTS
# --------------------
# Two things were missing from the `prod` stage while it used the stock
# nginx.conf, and both are silent:
#
#  1. **No SPA fallback.** The app is a react-router browser-history SPA. With
#     the default config, `/login` and `/projects/<id>/brief` are looked up as
#     files on disk, are not there, and return 404. Only `/` worked, so every
#     deep link, every share link and every page refresh broke.
#
#  2. **No CSP.** §13 requires "CSP (no inline scripts)" and HSTS. `index.html`
#     is deliberately written with no inline script so the policy can be strict
#     with no nonce and no 'unsafe-inline' for scripts — but a policy nobody
#     sends is not a policy. The API sets its own headers in
#     `garh_api.main.SecurityHeadersMiddleware`; that middleware never sees a
#     request for a static asset, so the SPA needs its own copy here.
#
# This config is mounted at /etc/nginx/conf.d/default.conf by apps/web/Dockerfile.
# It terminates plain HTTP on :80 — TLS, the real hostname and the /api reverse
# proxy belong to the deployment in front of it (docs/deployment.md).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints every asset it emits, so `dist/assets/*` is immutable and
    # `index.html` must never be cached — otherwise a deploy leaves browsers
    # asking for chunk hashes that no longer exist ("white screen after deploy").
    etag on;

    # ── Security headers (§13) ───────────────────────────────────────────────
    #
    # script-src 'self'      — index.html has NO inline script; the only <script>
    #                          is the hashed module entry. No 'unsafe-inline',
    #                          no 'unsafe-eval'. If a dependency ever needs eval,
    #                          replace the dependency, not this line.
    # style-src  'unsafe-inline' — React writes `style="..."` attributes (three.js
    #                          canvas sizing, transform-driven canvas overlays),
    #                          and CSP has no way to allow attribute styles
    #                          without it. Attribute styles cannot execute script.
    # img-src    data: blob: — data: for the inlined SVG icon set, blob: for
    #                          canvas snapshots (WhatsApp share preset, §15).
    # connect-src            — the API origin is a deploy-time value; `'self'`
    #                          covers a same-origin /api proxy, which is the
    #                          documented topology. A split-origin deploy MUST
    #                          add its API origin here or every fetch is blocked.
    # frame-ancestors 'none' — the app is never embedded; the client viewer is a
    #                          first-party page, not an iframe widget.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Nothing about a client's house design belongs in a search index.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ── Compression ──────────────────────────────────────────────────────────
    # §14 budgets the initial load at <1.5MB gzipped, which assumes this is on.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json image/svg+xml application/wasm;

    # ── Routing ──────────────────────────────────────────────────────────────

    # Hashed assets: immutable, cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Never let a stale shell survive a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # The SPA fallback. Any path that is not a real file is the client router's
    # problem, not a 404 — including /login, /projects/:id/:tab and /share/:token.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API is not served from here. Answer explicitly rather than handing an
    # HTML document to a fetch() that expected JSON — a misconfigured deploy
    # should look like a misconfigured deploy.
    location /api/ {
        return 404;
    }
}
