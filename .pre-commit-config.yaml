# Garh AI — pre-commit hooks.
#
#   pip install pre-commit && pre-commit install
#   pre-commit run --all-files        # first run, or after changing this file
#
# These run the FAST gates only: formatting, linting, and the secret/tenancy
# audits. Typechecking, tests and golden files run in CI (`make verify`) — they
# are too slow to sit in front of every commit, and a hook people disable is
# worse than no hook.
#
# Tool versions here are pinned to the same versions as the app manifests
# (ruff 0.6.9 from apps/api/pyproject.toml, prettier 3.3.3 from package.json).
# When you bump one, bump both, or the hook and CI will disagree.

default_language_version:
  python: python3.11

# Never lint generated artefacts or golden files.
exclude: |
  (?x)^(
      .*/node_modules/.*
    | .*/dist/.*
    | .*/\.venv/.*
    | apps/api/migrations/versions/.*
    | fixtures/.*
    | pnpm-lock\.yaml
    | .*\.dxf
    | .*\.svg
  )$

repos:
  # ─── Generic hygiene ────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        # Renders and weights belong in object storage, not git history.
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ['--markdown-linebreak-ext=md']
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-yaml
        # Compose uses YAML merge keys and anchors, which this hook's strict
        # parser rejects; it is validated by `docker compose config` instead.
        exclude: ^docker-compose\.yml$
      - id: check-json
        # JSON-with-comments files. The pattern must match at ANY depth: the old
        # `^tsconfig.*\.json` was anchored at the repo root and therefore missed
        # packages/model/tsconfig.json, packages/ui/tsconfig.json,
        # apps/web/tsconfig.json and apps/web/tsconfig.node.json — all four use
        # `//` comments, so the hook failed on every commit that touched them.
        exclude: '(^|/)tsconfig[^/]*\.json$|\.jsonc$|(^|/)\.prettierrc$'
      - id: check-toml
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ['--branch=main']

  # ─── Python: ruff (lint + format), config from apps/api/pyproject.toml ──────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ['--fix', '--config', 'apps/api/pyproject.toml']
      - id: ruff-format
        args: ['--config', 'apps/api/pyproject.toml']

  # ─── JS/TS/MD/YAML: prettier ────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        additional_dependencies: ['prettier@3.3.3']
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown, css]

  # ─── Project guards (§13) — the same targets CI runs ────────────────────────
  - repo: local
    hooks:
      - id: secret-audit
        name: 'secrets must not reach the client bundle (§13)'
        entry: make secret-audit
        language: system
        pass_filenames: false
        files: ^apps/web/

      - id: tenancy-audit
        name: 'only the repository layer may touch tables (§13)'
        entry: make tenancy-audit
        language: system
        pass_filenames: false
        files: ^apps/api/.*\.py$

      - id: no-float-geometry
        # Golden rule 6: geometry is integer millimetres. A float literal in the
        # Python model core is how sub-millimetre drift gets in, which breaks the
        # "Σ segments == overall" dimension-chain assertion much later and much
        # more confusingly. Ratios and scores are fine — hence the narrow scope.
        name: 'model core geometry stays integer millimetres'
        entry: >
          bash -c 'if grep -nE "(Mm|_mm|mm)[A-Za-z_]*\s*[:=]\s*-?[0-9]+\.[0-9]+" "$@"; then
          echo "  float assigned to a millimetre value — geometry is int mm (SKILL.md golden rule 6)"; exit 1; fi'
        language: system
        files: ^apps/api/garh_model/.*\.py$
