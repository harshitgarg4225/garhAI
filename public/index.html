<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GarhAI</title>
  <meta name="description" content="GarhAI — a personal AI assistant powered by Claude" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">✦</span>
        <span class="brand-name">GarhAI</span>
      </div>
      <div class="topbar-actions">
        <span id="status-pill" class="pill pill-muted" title="Backend status">checking…</span>
        <button id="new-chat" class="btn btn-ghost" type="button">New chat</button>
      </div>
    </header>

    <div id="config-banner" class="banner hidden">
      <strong>Almost there.</strong> The server has no Anthropic API key yet.
      Set <code>ANTHROPIC_API_KEY</code> in your Railway service variables and redeploy to start chatting.
    </div>

    <main id="chat" class="chat" aria-live="polite">
      <div id="empty-state" class="empty-state">
        <div class="empty-mark">✦</div>
        <h1>GarhAI</h1>
        <p>Your personal AI assistant, powered by Claude.</p>
        <div class="suggestions">
          <button class="suggestion" type="button">Explain something complex in simple terms</button>
          <button class="suggestion" type="button">Help me draft an email</button>
          <button class="suggestion" type="button">Review a snippet of code</button>
          <button class="suggestion" type="button">Brainstorm project ideas</button>
        </div>
      </div>
    </main>

    <footer class="composer-wrap">
      <form id="composer" class="composer">
        <textarea
          id="input"
          rows="1"
          placeholder="Message GarhAI…"
          autocomplete="off"
          autofocus
        ></textarea>
        <button id="send" class="btn btn-primary" type="submit" disabled>
          <span class="send-label">Send</span>
        </button>
      </form>
      <p class="fineprint">GarhAI can make mistakes. Consider checking important information.</p>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
